# Nord theme for Kitty
# Installed to ~/.config/kitty/kitty.conf by ricing.sh

font_family          JetBrainsMono Nerd Font
bold_font            auto
italic_font          auto
bold_italic_font     auto
font_size            11.0

background_opacity   0.90
window_padding_width 12
confirm_os_window_close 0

foreground           #D8DEE9
background           #2E3440
selection_foreground #2E3440
selection_background #D8DEE9
cursor               #D8DEE9
cursor_text_color    #2E3440
url_color            #88C0D0

active_border_color   #81A1C1
inactive_border_color #4C566A
bell_border_color     #EBCB8B

tab_bar_edge          bottom
tab_bar_style         separator
active_tab_foreground   #2E3440
active_tab_background   #88C0D0
inactive_tab_foreground #D8DEE9
inactive_tab_background #3B4252

# Black
color0  #3B4252
color8  #4C566A
# Red
color1  #BF616A
color9  #BF616A
# Green
color2  #A3BE8C
color10 #A3BE8C
# Yellow
color3  #EBCB8B
color11 #EBCB8B
# Blue
color4  #81A1C1
color12 #81A1C1
# Magenta
color5  #B48EAD
color13 #B48EAD
# Cyan
color6  #88C0D0
color14 #8FBCBB
# White
color7  #E5E9F0
color15 #ECEFF4

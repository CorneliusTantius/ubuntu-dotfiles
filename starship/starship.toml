# Nord theme for Starship, full info prompt
# Installed to ~/.config/starship.toml by ricing.sh
# Needs a Nerd Font (JetBrainsMono Nerd Font) for the language and git icons.

add_newline = true
palette = "nord"

format = """
[╭─](frost_dark)$username$hostname$directory$git_branch$git_status$nodejs$python$rust$golang$c$cmd_duration
[╰─](frost_dark)$time$battery$character"""

[palettes.nord]
polar_night_0 = "#2E3440"
polar_night_3 = "#4C566A"
snow_storm_2 = "#E5E9F0"
frost_teal = "#8FBCBB"
frost = "#88C0D0"
frost_blue = "#81A1C1"
frost_dark = "#5E81AC"
aurora_red = "#BF616A"
aurora_orange = "#D08770"
aurora_yellow = "#EBCB8B"
aurora_green = "#A3BE8C"
aurora_purple = "#B48EAD"

[username]
show_always = false
style_user = "bold frost"
style_root = "bold aurora_red"
format = "[$user]($style) "

[hostname]
ssh_only = false
style = "bold frost_blue"
format = "[@$hostname]($style) "

[directory]
style = "bold frost"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold aurora_purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold aurora_red"
format = "([$all_status$ahead_behind]($style)) "

[nodejs]
symbol = " "
style = "bold aurora_green"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold aurora_yellow"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold aurora_orange"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold frost_teal"
format = "[$symbol($version )]($style)"

[c]
symbol = " "
style = "bold frost_dark"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
style = "bold aurora_yellow"
format = "took [$duration]($style) "

[time]
disabled = false
style = "bold frost_blue"
time_format = "%H:%M"
format = "[$time]($style) "

[battery]
disabled = false

[character]
success_symbol = "[❯](bold aurora_green)"
error_symbol = "[❯](bold aurora_red)"
